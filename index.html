<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My RentPlace - Nền Tảng Thuê Nhà Sinh Viên</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="styles.css?v=7">
    
    <!-- Google Identity Services cho Đăng nhập thật -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    
    <div class="web-app-container">
        
        <!-- HEADER -->
        <header class="web-header">
            <div class="logo">
                <img src="https://img.icons8.com/fluency/48/home.png" alt="Logo">
                <h1>My RentPlace</h1>
            </div>

            <div class="header-search">
                <input type="text" id="main-search-input" placeholder="Bạn muốn tìm nhà trọ ở khu vực nào?" onkeyup="handleSearch()">
                <button><i class="fa-solid fa-search"></i></button>
            </div>

            <div class="header-actions">
                <button id="dark-mode-btn" class="nav-btn" onclick="toggleDarkMode()"><i class="fa-solid fa-moon"></i></button>
                <button id="history-btn" class="nav-btn" style="display:none;" onclick="openHistory()"><i class="fa-solid fa-clock-rotate-left" style="color:#3b82f6;"></i> Đã liên hệ</button>
                <button id="saved-rooms-btn" class="nav-btn" style="display:none;" onclick="openSavedRooms()"><i class="fa-solid fa-heart" style="color:#ef4444;"></i> Phòng đã lưu</button>
                <button class="nav-btn" onclick="openBlacklist()"><i class="fa-solid fa-shield-halved"></i> Tra cứu lừa đảo</button>
                <div id="auth-container" style="display: flex; align-items: center; gap: 10px;">
                    <!-- Nút Đăng Nhập Google Tích Hợp -->
                    <div id="google-btn-wrapper"></div>
                    <span style="color: #64748b; font-size: 0.9rem;">hoặc</span>
                    <button class="guest-btn" onclick="loginAsGuest()"><i class="fa-regular fa-user"></i> Chế độ Khách</button>
                </div>
            </div>
        </header>

        <!-- MAIN LAYOUT -->
        <main class="web-main">
            <!-- LEFT PANEL: DANH SÁCH -->
            <section class="left-panel">
                <div class="panel-header">
                    <h2>Hơn 500+ phòng trọ an toàn cho sinh viên</h2>
                    <div class="filters-container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 16px; margin-bottom: 30px;">
                        <div class="filters">
                            <button id="filter-all" class="active" onclick="handleFilter('all')">Tất cả</button>
                            <button id="filter-verified" onclick="handleFilter('verified')"><i class="fa-solid fa-circle-check" style="color: #10b981;"></i> Tick Xanh</button>
                            <button id="filter-cheap" onclick="handleFilter('cheap')">Dưới 2.5 Triệu</button>
                            <button id="filter-near" onclick="handleFilter('near')">Gần PTIT</button>
                        </div>
                        <div class="sort-box" style="display:flex; align-items:center; gap:8px;">
                            <span style="color:var(--text-muted); font-size:0.9rem;">Sắp xếp:</span>
                            <select id="sort-select" onchange="handleSort()" style="padding:10px 16px; border-radius:100px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-main); font-family:'Inter', sans-serif; outline:none; cursor:pointer;">
                                <option value="default">Gợi ý nền tảng</option>
                                <option value="price-asc">Giá: Thấp đến Cao</option>
                                <option value="rating-desc">Đánh giá: Cao nhất</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="listing-container" class="grid-listing">
                    <!-- JS sẽ tự đổ danh sách phòng trọ vào đây -->
                </div>
            </section>

            <!-- RIGHT PANEL: BẢN ĐỒ -->
            <section class="right-panel">
                <button id="locate-btn" class="locate-btn" onclick="locateUser()"><i class="fa-solid fa-location-crosshairs"></i> Vị trí của tôi</button>
                <div id="map-container"></div>
            </section>
        </main>
    </div>

    <!-- MODAL CHI TIẾT PHÒNG -->
    <div id="detail-modal" class="modal hidden">
        <button class="close-btn" onclick="closeModal('detail-modal')"><i class="fa-solid fa-xmark"></i></button>
        <div class="modal-content">
            <div id="detail-content-container"></div>
        </div>
    </div>

    <!-- MODAL BLACKLIST -->
    <div id="blacklist-modal" class="modal hidden">
        <button class="close-btn" onclick="closeModal('blacklist-modal')"><i class="fa-solid fa-xmark"></i></button>
        <div class="modal-content">
            <div class="blacklist-header">
                <h2><i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i> Danh Sách Đen Cò Mồi</h2>
                <div class="search-bar alert-search">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="blacklist-search-input" placeholder="Nhập Số điện thoại chủ nhà để tra cứu..." onkeyup="handleBlacklistSearch()">
                </div>
            </div>
            <div id="scam-list-container" class="scam-list"></div>
        </div>
    </div>

    <!-- MODAL PHÒNG ĐÃ LƯU -->
    <div id="saved-modal" class="modal hidden">
        <button class="close-btn" onclick="closeModal('saved-modal')"><i class="fa-solid fa-xmark"></i></button>
        <div class="modal-content">
            <div class="blacklist-header">
                <h2><i class="fa-solid fa-heart" style="color:#ef4444;"></i> Phòng Trọ Đã Lưu</h2>
            </div>
            <div id="saved-list-container" class="grid-listing" style="margin-top:20px; grid-template-columns: 1fr;">
                <!-- JS sẽ tự đổ danh sách phòng đã lưu -->
            </div>
        </div>
    </div>

    <!-- MODAL FORM YÊU CẦU THUÊ -->
    <div id="request-modal" class="modal hidden">
        <button class="close-btn" onclick="closeModal('request-modal')"><i class="fa-solid fa-xmark"></i></button>
        <div class="modal-content" style="max-width: 400px;">
            <div class="blacklist-header">
                <h2><i class="fa-solid fa-paper-plane" style="color:#2563eb;"></i> Gửi Liên Hệ Cho Chủ Nhà</h2>
            </div>
            <div style="margin-top: 20px; display:flex; flex-direction:column; gap:15px;">
                <input type="text" id="req-phone" placeholder="Số điện thoại của bạn" style="padding:10px; border-radius:5px; border:1px solid #cbd5e1; width:100%;">
                <textarea id="req-msg" placeholder="Lời nhắn (Ví dụ: Chào cô/chú, cháu muốn hỏi thuê phòng...)" rows="3" style="padding:10px; border-radius:5px; border:1px solid #cbd5e1; width:100%; font-family:'Inter', sans-serif;"></textarea>
                <button onclick="submitRentalRequest()" class="book-btn" style="width:100%;">Xác Nhận Gửi Yêu Cầu</button>
            </div>
        </div>
    </div>

    <!-- MODAL LỊCH SỬ LIÊN HỆ -->
    <div id="history-modal" class="modal hidden">
        <button class="close-btn" onclick="closeModal('history-modal')"><i class="fa-solid fa-xmark"></i></button>
        <div class="modal-content">
            <div class="blacklist-header">
                <h2><i class="fa-solid fa-clock-rotate-left" style="color:#3b82f6;"></i> Phòng Trọ Đã Liên Hệ</h2>
            </div>
            <div id="history-list-container" class="grid-listing" style="margin-top:20px; grid-template-columns: 1fr;">
                <!-- JS sẽ đổ ds -->
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js?v=6"></script>
</body>
</html>
